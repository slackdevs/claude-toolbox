<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Toolbox — herramientas para profesionales de Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1014;--panel:#151920;--panel2:#1b2029;--line:#283040;--text:#e7e9ee;--muted:#98a1b1;--acc:#e8875b;--acc-soft:rgba(232,135,91,.14);--ok:#4cc38a;--warn:#e5b443;--bad:#ef6461;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--r:12px}
[data-theme=light]{--bg:#f5f4f1;--panel:#ffffff;--panel2:#f0eee9;--line:#e1ddd5;--text:#1c1e22;--muted:#626a76;--acc:#c75f32;--acc-soft:rgba(199,95,50,.10)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:58px;padding:0 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
.logo svg{flex:none}
.logo small{font-weight:500;color:var(--muted);font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.hbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;cursor:pointer;font:inherit}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
aside h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
aside a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px}
aside a:hover{background:var(--panel2)}
aside a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
main{padding:26px 30px 80px;min-width:0}
.hero h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0 0 18px;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;position:relative;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:6px}
.tcard:hover{border-color:var(--acc);transform:translateY(-1px)}
.tcard h3{margin:0;font-size:15px;padding-right:26px}
.tcard p{margin:0;color:var(--muted);font-size:13px;flex:1}
.ico{width:34px;height:34px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:17px;margin-bottom:4px}
.fav{position:absolute;top:12px;right:12px;background:none;border:0;cursor:pointer;font-size:17px;color:var(--muted);line-height:1}
.fav.on{color:var(--warn)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.tool-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.tool-head h1{margin:0;font-size:22px}
.tool-head p{margin:4px 0 0;color:var(--muted);max-width:860px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.grid2>*{min-width:0}
.grid2+.card,.grid2+.grid2{margin-top:14px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
textarea{font-family:var(--mono);font-size:12.5px;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:4px 10px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.out{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--panel2)}
.out-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-family:var(--mono)}
.out pre{margin:0;padding:12px;overflow:auto;max-height:460px;font:12.5px/1.5 var(--mono);white-space:pre}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.lint{list-style:none;padding:0;margin:0}
.lint li{padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;border-left:3px solid}
.lint .ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
.lint .warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:var(--warn)}
.lint .bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
.bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);margin:8px 0}
.bar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:4px;margin-bottom:-1px}
.tabs button{background:none;border:1px solid transparent;border-bottom:0;color:var(--muted);padding:6px 12px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;font-size:12.5px}
.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
.prow{display:grid;grid-template-columns:1.1fr .8fr .5fr 1fr 1.6fr auto;gap:6px;margin-bottom:6px;align-items:center}
.prow input,.prow select{padding:6px 8px;font-size:12.5px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.score{font-size:34px;font-weight:700}
.pat{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.pat.rec{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pat h4{margin:0 0 4px;font-size:14px}
.pat p{margin:4px 0;font-size:13px;color:var(--muted)}
.q{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.q div{display:flex;gap:6px;flex:none}
.seg{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.seg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.progress{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--acc)}
.dom{margin-bottom:12px}
.dom summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;padding:6px 0}
.dom label.chk{padding:4px 0;font-weight:400;font-size:13px}
footer{color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:58px;width:280px;background:var(--bg);z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
 aside.open{transform:none}
 .menu-btn{display:inline-block}
 .grid2{grid-template-columns:1fr}
 main{padding:18px 14px 60px}
 .logo small{display:none}
 .prow{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <button class="hbtn menu-btn" id="menuBtn" aria-label="Menú">☰</button>
  <div class="logo" id="homeLink">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M9 21l6-6m0 0l-2-2 4-4 2 2m-4 4l2 2 4-4m-2-2l4-4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Claude Toolbox <small>no oficial</small>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar herramienta… (tecla /)" autocomplete="off">
  </div>
  <button class="hbtn" id="themeBtn" title="Cambiar tema">☀ / ☾</button>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const fmt = (n, d = 0) => Number(n).toLocaleString('es-AR', {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = n => '$' + (n >= 1 || n === 0 ? fmt(n, 2) : n >= 0.01 ? fmt(n, 4) : fmt(n, 5));
const num = (root, id) => { const v = parseFloat($('#' + id, root)?.value); return isNaN(v) ? 0 : v; };
const val = (root, id) => ($('#' + id, root)?.value ?? '').trim();
const chk = (root, id) => !!$('#' + id, root)?.checked;
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const OUT = (id, label = '') => `<div class="out"><div class="out-h"><span>${label}</span><button class="btn sm ghost" data-copy="${id}">Copiar</button></div><pre id="${id}"></pre></div>`;
const setOut = (root, id, text) => { const el = $('#' + id, root); if (el) el.textContent = text; };
const lintHTML = items => `<ul class="lint">${items.map(([t, m]) => `<li class="${t}">${m}</li>`).join('')}</ul>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400); }
function copyText(text) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('¡Copiado!'); } catch (e) { toast('Seleccioná y copiá manualmente'); } ta.remove(); };
  try { navigator.clipboard.writeText(text).then(() => toast('¡Copiado!'), fallback); } catch (e) { fallback(); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) { const el = document.getElementById(b.dataset.copy); if (el) copyText(el.textContent); } });
const yamlStr = s => /^[\w .,()\/-]*$/.test(s) && s && !/^\s|\s$/.test(s) ? s : JSON.stringify(s);
function toPy(v, ind = 0) {
  const p = '    '.repeat(ind + 1), e = '    '.repeat(ind);
  if (v === null) return 'None'; if (v === true) return 'True'; if (v === false) return 'False';
  if (typeof v === 'number') return String(v); if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return v.length ? '[\n' + v.map(x => p + toPy(x, ind + 1)).join(',\n') + '\n' + e + ']' : '[]';
  const ks = Object.keys(v); return ks.length ? '{\n' + ks.map(k => p + JSON.stringify(k) + ': ' + toPy(v[k], ind + 1)).join(',\n') + '\n' + e + '}' : '{}';
}
const shq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";

/* ============ Datos ============ */
// Precios USD por millón de tokens (fuentes públicas, oct-nov 2026). Editables en la calculadora.
const MODELS = [
  {id: 'claude-fable-5-1', name: 'Fable 5.1', pin: 10, pout: 50, pcr: 1.00, ctx: 1000000, note: 'lectura de caché estimada (10%)'},
  {id: 'claude-opus-5-5', name: 'Opus 5.5', pin: 4, pout: 20, pcr: 0.20, ctx: 1000000},
  {id: 'claude-sonnet-5-5', name: 'Sonnet 5.5', pin: 2, pout: 10, pcr: 0.20, ctx: 1000000},
  {id: 'claude-haiku-5-5', name: 'Haiku 5.5', pin: 0.10, pout: 0.50, pcr: 0.01, ctx: 1000000, tier: {limit: 100000, pin: 0.50, pout: 2.50, pcr: 0.05}}
];
const priceFor = (m, prompt) => (m.tier && prompt > m.tier.limit) ? {pin: m.tier.pin, pout: m.tier.pout, pcr: m.tier.pcr, t2: true} : {pin: m.pin, pout: m.pout, pcr: m.pcr, t2: false};
const modelOpts = (sel = 'claude-sonnet-5-5') => MODELS.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${m.name} — ${m.id}</option>`).join('');

const CERTS = {
  A:  {code: 'CCAO-F', name: 'Associate – Foundations'},
  D:  {code: 'CCDV-F', name: 'Developer – Foundations'},
  AF: {code: 'CCAR-F', name: 'Architect – Foundations'},
  AP: {code: 'CCAR-P', name: 'Architect – Professional'},
  B:  {code: 'Badge CC', name: 'Partner Badge – Claude Code'}
};
const CATS = [
  ['api', 'API, costos y tokens'],
  ['prompt', 'Prompts y evaluación'],
  ['tools', 'Tools, MCP y salida estructurada'],
  ['code', 'Claude Code'],
  ['arch', 'Arquitectura y certificación']
];

/* ============ Herramientas ============ */
const TOOLS = [];
const T = t => TOOLS.push(t);

/* ---------- 1. Calculadora de costos ---------- */
T({id: 'costos', cat: 'api', ico: '$', name: 'Calculadora de costos API', certs: ['A','D','AF','AP','B'],
 desc: 'Costo por request, día y mes por modelo, con prompt caching y Batch API. Compara los 4 modelos.',
 html: () => `
 <div class="grid2">
  <div class="card">
   <div class="row"><label>Modelo<select id="c-model">${modelOpts()}</select></label></div>
   <div class="row">
    <label>Tokens de entrada sin caché / req<input type="number" id="c-in" value="3000" min="0"></label>
    <label>Tokens de salida / req<input type="number" id="c-out" value="800" min="0"></label>
    <label>Requests por día<input type="number" id="c-rpd" value="1000" min="0"></label>
   </div>
   <div class="row">
    <label>Tokens leídos de caché / req<input type="number" id="c-cr" value="0" min="0"></label>
    <label>Tokens escritos en caché / req<input type="number" id="c-cw" value="0" min="0"></label>
    <label>TTL de caché<select id="c-ttl"><option value="1.25">5 minutos (1,25× entrada)</option><option value="2">1 hora (2× entrada)</option></select></label>
   </div>
   <div class="row">
    <label>Días por mes<input type="number" id="c-days" value="30" min="1"></label>
    <label class="chk"><input type="checkbox" id="c-batch"> Batch API (−50%)</label>
   </div>
   <details><summary class="note" style="cursor:pointer">Precios USD / millón de tokens (editables)</summary>
    <div class="row" style="margin-top:8px">
     <label>Entrada<input type="number" id="c-pin" step="0.01"></label>
     <label>Salida<input type="number" id="c-pout" step="0.01"></label>
     <label>Lectura de caché<input type="number" id="c-pcr" step="0.001"></label>
    </div>
    <p class="note" id="c-pnote"></p>
   </details>
  </div>
  <div class="card"><h3>Resultado</h3><div id="c-res"></div></div>
 </div>
 <div class="card"><h3>Mismo volumen en todos los modelos</h3><div id="c-cmp"></div>
  <p class="note">Precios de lista tomados de fuentes públicas (oct–nov 2026). Verificalos siempre en la página oficial de precios antes de presupuestar. El descuento de Batch se aplica aquí a todo el request como aproximación.</p></div>`,
 init(r) {
  let lastKey = '';
  const fill = (m, p) => { $('#c-pin', r).value = p.pin; $('#c-pout', r).value = p.pout; $('#c-pcr', r).value = p.pcr;
    $('#c-pnote', r).textContent = (m.note ? 'Nota: ' + m.note + '. ' : '') + (m.tier ? `Haiku cambia de tarifa cuando el prompt supera ${fmt(m.tier.limit)} tokens${p.t2 ? ' (tarifa alta aplicada)' : ''}.` : ''); };
  const calc = (pin, pout, pcr, o) => {
   const ttl = o.ttl, perReq = (o.inp * pin + o.cw * pin * ttl + o.cr * pcr + o.out * pout) / 1e6 * (o.batch ? .5 : 1);
   return perReq;
  };
  const run = () => {
   const m = MODELS.find(x => x.id === val(r, 'c-model'));
   const o = {inp: num(r,'c-in'), out: num(r,'c-out'), cr: num(r,'c-cr'), cw: num(r,'c-cw'), ttl: parseFloat(val(r,'c-ttl')), batch: chk(r,'c-batch')};
   const prompt = o.inp + o.cr + o.cw, p = priceFor(m, prompt), key = m.id + p.t2;
   if (key !== lastKey) { fill(m, p); lastKey = key; }
   const pin = num(r,'c-pin'), pout = num(r,'c-pout'), pcr = num(r,'c-pcr');
   const rpd = num(r,'c-rpd'), days = num(r,'c-days');
   const per = calc(pin, pout, pcr, o), noCache = calc(pin, pout, pcr, {...o, inp: prompt, cr: 0, cw: 0});
   const save = noCache > 0 ? (1 - per / noCache) * 100 : 0;
   const parts = [['Entrada', o.inp * pin], ['Escritura caché', o.cw * pin * o.ttl], ['Lectura caché', o.cr * pcr], ['Salida', o.out * pout]].map(([k, v]) => [k, v / 1e6 * (o.batch ? .5 : 1)]);
   $('#c-res', r).innerHTML = `<div class="kpis">
     <div class="kpi"><span>Por request</span><b>${usd(per)}</b></div>
     <div class="kpi"><span>Por día</span><b>${usd(per * rpd)}</b></div>
     <div class="kpi"><span>Por mes</span><b>${usd(per * rpd * days)}</b></div>
     <div class="kpi"><span>Ahorro por caché</span><b>${(o.cr || o.cw) ? fmt(save, 1) + '%' : '—'}</b></div></div>
     <table><tr><th>Componente</th><th class="num">USD / request</th><th class="num">% del costo</th></tr>

T({id: 'contexto', cat: 'api', ico: '▤', name: 'Presupuesto de ventana de contexto', certs: ['D','AF','AP'],

 <div class="grid2"><div class="card">

T({id: 'sse', cat: 'api', ico: '⋯', name: 'Visor de streaming SSE', certs: ['D'],
 desc: 'Pegá un stream crudo de la API y reconstruí texto, inputs de tool_use, thinking, stop_reason y uso de tokens.',
 html: () => `
 <div class="card"><div class="btns"><button class="btn ghost sm" id="s-sample">Cargar ejemplo</button></div>
 <label>Stream SSE crudo<textarea id="s-in" style="min-height:220px" placeholder="event: message_start&#10;data: {...}"></textarea></label></div>
 <div class="card" id="s-res"></div>`,
 init(r) {
  $('#s-sample', r).onclick = () => { $('#s-in', r).value = SSE_SAMPLE; run(); };
  const run = () => {
   const evs = []; let cur = {};
   for (const ln of $('#s-in', r).value.split(/\r?\n/)) {
    if (ln.startsWith('event:')) cur.event = ln.slice(6).trim();
    else if (ln.startsWith('data:')) cur.data = (cur.data || '') + ln.slice(5).trim();
    else if (!ln.trim() && (cur.event || cur.data)) { evs.push(cur); cur = {}; }
   }
   if (cur.event || cur.data) evs.push(cur);
   if (!evs.length) { $('#s-res', r).innerHTML = '<div class="empty">Pegá un stream o cargá el ejemplo.</div>'; return; }
   const blocks = {}, counts = {}, errs = []; let stop = '—', usageIn = 0, usageOut = 0, model = '';
   evs.forEach((e, i) => {
    let d; try { d = JSON.parse(e.data || '{}'); } catch (x) { errs.push(`Evento ${i + 1}: JSON inválido`); return; }
    const type = d.type || e.event; counts[type] = (counts[type] || 0) + 1;
    if (type === 'message_start') { usageIn = d.message?.usage?.input_tokens || 0; model = d.message?.model || ''; }
    if (type === 'content_block_start') blocks[d.index] = {type: d.content_block?.type, name: d.content_block?.name, text: d.content_block?.text || '', json: '', thinking: ''};
    if (type === 'content_block_delta') { const b = blocks[d.index] || (blocks[d.index] = {type: '?', text: '', json: '', thinking: ''}); const dl = d.delta || {};
     if (dl.type === 'text_delta') b.text += dl.text; if (dl.type === 'input_json_delta') b.json += dl.partial_json; if (dl.type === 'thinking_delta') b.thinking += dl.thinking; }
    if (type === 'message_delta') { stop = d.delta?.stop_reason || stop; usageOut = d.usage?.output_tokens ?? usageOut; }
    if (type === 'error') errs.push(`Error de API: ${d.error?.type} — ${d.error?.message}`);
   });
   const bl = Object.entries(blocks).map(([i, b]) => {
    let content = b.type === 'tool_use' ? (() => { try { return JSON.stringify(JSON.parse(b.json || '{}'), null, 2); } catch (x) { return b.json + '\n⚠ JSON parcial/incompleto'; } })() : b.type === 'thinking' ? b.thinking : b.text;
    return `<h3 style="margin-top:12px">Bloque ${i} · <span class="pill">${esc(b.type)}</span> ${b.name ? '<code>' + esc(b.name) + '</code>' : ''}</h3><div class="out"><pre>${esc(content)}</pre></div>`;
   }).join('');
   $('#s-res', r).innerHTML = `<div class="kpis"><div class="kpi"><span>Eventos</span><b>${evs.length}</b></div><div class="kpi"><span>stop_reason</span><b style="font-size:15px">${esc(stop)}</b></div><div class="kpi"><span>Tokens entrada</span><b>${fmt(usageIn)}</b></div><div class="kpi"><span>Tokens salida</span><b>${fmt(usageOut)}</b></div></div>
    ${errs.length ? lintHTML(errs.map(x => ['bad', esc(x)])) : ''}
    <p class="note">${model ? 'Modelo: <code>' + esc(model) + '</code> · ' : ''}${Object.entries(counts).map(([k, v]) => `<code>${esc(k)}</code>×${v}`).join(' ')}</p>
    ${stop === 'tool_use' ? lintHTML([['ok', 'stop_reason = tool_use: ejecutá la herramienta y devolvé un bloque <code>tool_result</code> con el mismo <code>tool_use_id</code> en el próximo mensaje de usuario.']]) : ''}${bl}`;
  };
  r.addEventListener('input', run); run();
 }});

   const neg = (t.match(/\b(no|nunca|jamás|don't|never|do not|evita)\b/gi) || []).length, pos = (t.match(/\b(usa|escribe|responde|incluye|devuelve|use|write|include|return)\b/gi) || []).length;

/* ---------- 12. Validador JSON Schema ---------- */
function typeName(v) { return v === null ? 'null' : Array.isArray(v) ? 'array' : Number.isInteger(v) ? 'integer' : typeof v; }

 if (s.enum && !s.enum.some(e => JSON.stringify(e) === JSON.stringify(v))) errs.push(`${path}: "${JSON.stringify(v)}" no está en enum ${JSON.stringify(s.enum)}`);
 if ('const' in s && JSON.stringify(s.const) !== JSON.stringify(v)) errs.push(`${path}: debe ser ${JSON.stringify(s.const)}`);
 if (s.type) { const ts = [].concat(s.type); if (!ts.some(t => typeOk(t, v))) { errs.push(`${path}: se esperaba ${ts.join('|')}, llegó ${typeName(v)}`); return errs; } }
 if (s.anyOf && !s.anyOf.some(x => !validate(x, v, path, []).length)) errs.push(`${path}: no cumple ninguna opción de anyOf`);
 if (s.oneOf && s.oneOf.filter(x => !validate(x, v, path, []).length).length !== 1) errs.push(`${path}: debe cumplir exactamente una opción de oneOf`);
 const n = typeName(v);
 if (n === 'object') {
  (s.required || []).forEach(k => { if (!(k in v)) errs.push(`${path}: falta la propiedad requerida "${k}"`); });
  const pr = s.properties || {};
  Object.keys(v).forEach(k => { if (pr[k]) validate(pr[k], v[k], `${path}.${k}`, errs); else if (s.additionalProperties === false) errs.push(`${path}: propiedad no permitida "${k}"`); else if (typeof s.additionalProperties === 'object') validate(s.additionalProperties, v[k], `${path}.${k}`, errs); });
 }
 if (n === 'array') { if (s.items) v.forEach((x, i) => validate(s.items, x, `${path}[${i}]`, errs)); if (s.minItems != null && v.length < s.minItems) errs.push(`${path}: mínimo ${s.minItems} elementos`); if (s.maxItems != null && v.length > s.maxItems) errs.push(`${path}: máximo ${s.maxItems} elementos`); }
 if (n === 'string') { if (s.minLength != null && v.length < s.minLength) errs.push(`${path}: longitud mínima ${s.minLength}`); if (s.maxLength != null && v.length > s.maxLength) errs.push(`${path}: longitud máxima ${s.maxLength}`); if (s.pattern) { try { if (!new RegExp(s.pattern).test(v)) errs.push(`${path}: no cumple pattern ${s.pattern}`); } catch (e) {} } }
 if (n === 'integer' || n === 'number') { if (s.minimum != null && v < s.minimum) errs.push(`${path}: menor que minimum ${s.minimum}`); if (s.maximum != null && v > s.maximum) errs.push(`${path}: mayor que maximum ${s.maximum}`); }
 return errs;
}
function infer(v) { const n = typeName(v);
 if (n === 'object') { const p = {}; Object.keys(v).forEach(k => p[k] = infer(v[k])); return {type: 'object', properties: p, required: Object.keys(v), additionalProperties: false}; }
 if (n === 'array') return {type: 'array', items: v.length ? infer(v[0]) : {}};
 return {type: n}; }

T({id: 'mcp', cat: 'tools', ico: '⧉', name: 'Configurador de servidores MCP', certs: ['D','AF','AP','B'],

 html: () => `
 <div class="grid2"><div class="card">

  <div id="m-stdio"><div class="row"><label>Comando<input id="m-cmd" value="npx"></label><label>Argumentos (espacios)<input id="m-args" value="-y @modelcontextprotocol/server-filesystem ./docs"></label></div>

 </div><div>${OUT('m-cli', 'CLI de Claude Code')}${OUT('m-json', '.mcp.json')}${OUT('m-desk', 'claude_desktop_config.json')}</div></div>`,
 init(r) {
  const run = () => {
   const name = val(r,'m-name') || 'server', tr = val(r,'m-tr'), scope = val(r,'m-scope');
   $('#m-stdio', r).style.display = tr === 'stdio' ? '' : 'none'; $('#m-http', r).style.display = tr === 'stdio' ? 'none' : '';
   const env = Object.fromEntries(lines($('#m-env', r).value).map(l => { const i = l.indexOf('='); return [l.slice(0, i).trim(), l.slice(i + 1).trim()]; }).filter(x => x[0]));
   const hdr = Object.fromEntries(lines($('#m-h', r).value).map(l => { const i = l.indexOf(':'); return [l.slice(0, i).trim(), l.slice(i + 1).trim()]; }).filter(x => x[0]));
   const args = val(r,'m-args').split(/\s+/).filter(Boolean);
   let cli, cfg;
   if (tr === 'stdio') {
    cli = `claude mcp add --transport stdio --scope ${scope} ${Object.entries(env).map(([k, v]) => `--env ${k}=${shq(v)} `).join('')}${name} -- ${val(r,'m-cmd')} ${args.join(' ')}`;
    cfg = {command: val(r,'m-cmd'), args}; if (Object.keys(env).length) cfg.env = env;
   } else {
    cli = `claude mcp add --transport ${tr} --scope ${scope} ${Object.entries(hdr).map(([k, v]) => `--header ${shq(k + ': ' + v)} `).join('')}${name} ${val(r,'m-url')}`;
    cfg = {type: tr, url: val(r,'m-url')}; if (Object.keys(hdr).length) cfg.headers = hdr;
   }
   setOut(r, 'm-cli', cli + `\n\n# Verificar\nclaude mcp list\nclaude mcp get ${name}\n# Dentro de Claude Code: /mcp`);
   setOut(r, 'm-json', JSON.stringify({mcpServers: {[name]: cfg}}, null, 2));
   setOut(r, 'm-desk', tr === 'stdio' ? JSON.stringify({mcpServers: {[name]: cfg}}, null, 2) : '// Claude Desktop agrega servidores remotos como conectores desde\n// Configuración → Conectores, no desde este archivo.');
   const L = [];
   const secrets = Object.values({...env, ...hdr}).some(v => v && !/\$\{\w+\}/.test(v) && v.length > 12);
   if (secrets && scope === 'project') L.push(['bad', 'Parece haber un secreto literal en un archivo que se commitea. Usá expansión de variables <code>${VAR}</code> en .mcp.json.']);
   else L.push(['ok', 'Secretos referenciados con <code>${VAR}</code> (expansión de entorno).']);
   if (scope === 'project') L.push(['ok', '.mcp.json va en la raíz del repo y se versiona; cada compañero aprueba el servidor la primera vez.']);
   if (tr === 'sse') L.push(['warn', 'SSE está en desuso: preferí HTTP (streamable) si el servidor lo soporta.']);
   L.push(['ok', 'Las tools MCP aparecen como <code>mcp__' + esc(name) + '__&lt;tool&gt;</code>: usá ese nombre en permisos y matchers de hooks.']);
   $('#m-lint', r).innerHTML = lintHTML(L);
  };
  r.addEventListener('input', run); r.addEventListener('change', run); run();
 }});

const PERM_PRESETS = {
 allow: ['Bash(npm run *)', 'Bash(pnpm test *)', 'Bash(git status)', 'Bash(git diff *)', 'Bash(git log *)', 'WebFetch(domain:code.claude.com)'],
 ask: ['Bash(git push *)', 'Bash(git commit *)', 'Bash(npm install *)'],

T({id: 'permisos', cat: 'code', ico: '🔒', name: 'Constructor de settings.json y permisos', certs: ['AF','AP','B'],
 desc: 'Reglas allow / ask / deny, modo de permisos por defecto y variables de entorno, con lint de seguridad.',
 html: () => `
 <div class="grid2"><div class="card">
  ${['allow','ask','deny'].map(k => `<h3 style="margin-top:6px">${k}</h3><div class="btns">${PERM_PRESETS[k].map((p, i) => `<label class="chk"><input type="checkbox" data-k="${k}" data-v="${esc(p)}" ${k !== 'ask' || i === 0 ? 'checked' : ''}><code>${esc(p)}</code></label>`).join('')}</div><label>Reglas extra (una por línea)<textarea id="g-${k}" style="min-height:44px"></textarea></label>`).join('')}
  <div class="row" style="margin-top:10px"><label>defaultMode<select id="g-mode"><option value="">(sin definir)</option><option>default</option><option>acceptEdits</option><option>plan</option><option>bypassPermissions</option></select></label><label>Archivo destino<select id="g-file"><option value=".claude/settings.json">.claude/settings.json (equipo)</option><option value=".claude/settings.local.json">.claude/settings.local.json (personal)</option><option value="~/.claude/settings.json">~/.claude/settings.json (usuario)</option></select></label></div>
  <label>env (KEY=valor)<textarea id="g-env" style="min-height:44px"></textarea></label>
 </div><div>${OUT('g-out', 'settings.json')}<div class="card"><h3>Revisión</h3><div id="g-lint"></div>
  <p class="note">Orden de evaluación: <b>deny → ask → allow</b>; la primera coincidencia decide. Precedencia de archivos: política gestionada &gt; argumentos CLI &gt; local &gt; proyecto &gt; usuario.</p></div></div></div>`,
 init(r) {
  const run = () => {
   const P = {}; ['allow','ask','deny'].forEach(k => { P[k] = [...$$(`input[data-k=${k}]:checked`, r).map(x => x.dataset.v), ...lines($('#g-' + k, r).value)]; if (!P[k].length) delete P[k]; });
   const o = {$schema: 'https://json.schemastore.org/claude-code-settings.json', permissions: P};
   if (val(r,'g-mode')) o.permissions.defaultMode = val(r,'g-mode');
   const env = Object.fromEntries(lines($('#g-env', r).value).map(l => { const i = l.indexOf('='); return [l.slice(0, i), l.slice(i + 1)]; }).filter(x => x[0])); if (Object.keys(env).length) o.env = env;
   $('.out-h span', $('#g-out', r).parentElement).textContent = val(r,'g-file');
   setOut(r, 'g-out', JSON.stringify(o, null, 2));
   const L = [], all = [...(P.allow || [])];
   if (all.includes('Bash') || all.includes('Bash(*)')) L.push(['bad', '<code>Bash</code> sin especificador en allow aprueba cualquier comando.']);
   if (val(r,'g-mode') === 'bypassPermissions') L.push(['bad', 'bypassPermissions omite todas las confirmaciones: solo en contenedores aislados/CI efímeros.']);
   if (!(P.deny || []).some(x => /\.env/.test(x))) L.push(['warn', 'Considerá denegar lectura de <code>.env</code> y secretos.']); else L.push(['ok', 'Secretos protegidos por deny.']);
   if ((P.allow || []).some(x => /^Bash\((curl|wget)/.test(x))) L.push(['warn', 'Permitir curl/wget habilita exfiltración de datos; preferí WebFetch(domain:…).']);
   if (val(r,'g-file').includes('settings.json') && !val(r,'g-file').includes('local') && Object.values(env).some(v => v.length > 16)) L.push(['bad', 'Posible secreto en env de un archivo compartido.']);
   L.push(['ok', 'Los patrones Bash son por prefijo y pueden eludirse con encadenamientos; para garantías fuertes combiná con hooks PreToolUse o sandbox.']);
   $('#g-lint', r).innerHTML = lintHTML(L);
  };
  r.addEventListener('input', run); r.addEventListener('change', run); run();
 }});

const HOOK_EVENTS = {PreToolUse: 'nombre de tool (Bash, Edit|Write, mcp__.*)', PostToolUse: 'nombre de tool', PostToolUseFailure: 'nombre de tool', PermissionRequest: 'nombre de tool', UserPromptSubmit: '— (sin matcher)', Stop: '— (sin matcher)', SubagentStart: 'tipo de agente', SubagentStop: 'tipo de agente', SessionStart: 'startup | resume | clear | compact', SessionEnd: 'clear | logout | other…', Notification: 'permission_prompt | idle_prompt…', PreCompact: 'manual | auto', PostCompact: 'manual | auto'};
const HOOK_TPL = [
 ['Formatear tras editar', 'PostToolUse', 'Edit|Write', "jq -r '.tool_input.file_path' | xargs npx prettier --write"],
 ['Bloquear comandos peligrosos', 'PreToolUse', 'Bash', '"$CLAUDE_PROJECT_DIR"/.claude/hooks/block-dangerous.sh'],
 ['Proteger .env', 'PreToolUse', 'Read|Edit|Write', "jq -r '.tool_input.file_path // empty' | grep -qE '(^|/)\\.env' && { echo 'Acceso a .env bloqueado por política' >&2; exit 2; } || exit 0"],
 ['Contexto al iniciar', 'SessionStart', 'startup', 'git status --short; cat TODO.md 2>/dev/null'],
 ['Exigir tests al terminar', 'Stop', '', "npm test --silent >/dev/null 2>&1 || { echo 'Los tests fallan: corrígelos antes de terminar' >&2; exit 2; }"],
 ['Notificación de escritorio', 'Notification', 'permission_prompt', "notify-send 'Claude Code' 'Necesita tu aprobación'"]
];
T({id: 'hooks', cat: 'code', ico: '⚓', name: 'Constructor de hooks', certs: ['AF','AP','B'],
 desc: 'Arma hooks deterministas (PreToolUse, PostToolUse, Stop, SessionStart…) con plantillas y semántica de exit codes.',
 html: () => `
 <div class="card"><h3>Plantillas</h3><div class="btns">${HOOK_TPL.map((t, i) => `<button class="btn ghost sm" data-tpl="${i}">${t[0]}</button>`).join('')}</div>
  <div class="row"><label>Evento<select id="h-ev">${Object.keys(HOOK_EVENTS).map(e => `<option>${e}</option>`).join('')}</select></label><label>Matcher <span id="h-mh" class="note"></span><input id="h-m" value="Bash"></label><label>Timeout (s, opcional)<input type="number" id="h-to"></label></div>
  <label>Comando<input id="h-cmd" value="" placeholder="script o comando de shell (recibe JSON por stdin)"></label>
  <div class="btns"><button class="btn sm" id="h-add">Agregar hook</button><button class="btn ghost sm" id="h-clear">Vaciar</button></div>
  <div id="h-list"></div></div>
 <div class="grid2"><div>${OUT('h-out', '.claude/settings.json → hooks')}${OUT('h-script', '.claude/hooks/block-dangerous.sh')}</div>
 <div class="card"><h3>Exit codes</h3><table>
  <tr><td><code>0</code></td><td>Sin objeción. En PreToolUse <b>no</b> aprueba: sigue el flujo de permisos normal. En UserPromptSubmit/SessionStart, stdout se agrega al contexto.</td></tr>
  <tr><td><code>2</code></td><td>Bloquea (en eventos bloqueables): stderr vuelve a Claude como feedback. En Stop, impide que termine y lo obliga a seguir.</td></tr>
  <tr><td>otro</td><td>Error no bloqueante: se muestra y la ejecución continúa.</td></tr></table>
  <p class="note">Hooks = garantías deterministas (siempre se ejecutan). Instrucciones en CLAUDE.md = guía probabilística. Para reglas que “nunca” deben romperse, usá hooks. En Stop, revisá <code>stop_hook_active</code> para evitar loops infinitos.</p></div></div>`,
 init(r) {
  let hooks = [];
  const evSel = $('#h-ev', r);
  const hint = () => $('#h-mh', r).textContent = '· ' + HOOK_EVENTS[evSel.value];
  r.addEventListener('click', e => {
   const t = e.target.closest('[data-tpl]'); if (t) { const x = HOOK_TPL[t.dataset.tpl]; hooks.push({ev: x[1], m: x[2], cmd: x[3]}); run(); }
   if (e.target.id === 'h-add') { const cmd = val(r,'h-cmd'); if (!cmd) { toast('Escribí un comando'); return; } hooks.push({ev: evSel.value, m: val(r,'h-m'), cmd, to: num(r,'h-to')}); run(); }
   if (e.target.id === 'h-clear') { hooks = []; run(); }
   const d = e.target.closest('[data-del]'); if (d) { hooks.splice(+d.dataset.del, 1); run(); }
  });
  const run = () => {
   hint();
   const o = {hooks: {}};
   hooks.forEach(h => { const arr = o.hooks[h.ev] || (o.hooks[h.ev] = []); const nomatch = /sin matcher/.test(HOOK_EVENTS[h.ev]);
    let g = arr.find(x => (x.matcher || '') === (nomatch ? '' : h.m)); if (!g) { g = nomatch || !h.m ? {hooks: []} : {matcher: h.m, hooks: []}; arr.push(g); }
    const hk = {type: 'command', command: h.cmd}; if (h.to) hk.timeout = h.to; g.hooks.push(hk); });
   setOut(r, 'h-out', hooks.length ? JSON.stringify(o, null, 2) : '// Agregá hooks con las plantillas o el formulario');
   $('#h-list', r).innerHTML = hooks.length ? `<table><tr><th>Evento</th><th>Matcher</th><th>Comando</th><th></th></tr>${hooks.map((h, i) => `<tr><td>${h.ev}</td><td><code>${esc(h.m || '—')}</code></td><td><code>${esc(h.cmd)}</code></td><td><button class="btn ghost sm" data-del="${i}">✕</button></td></tr>`).join('')}</table>` : '';
   setOut(r, 'h-script', `#!/usr/bin/env bash
# PreToolUse (matcher: Bash). Recibe el JSON del evento por stdin.
INPUT=$(cat)
CMD=$(echo "$INPUT" | jq -r '.tool_input.command // empty')

if echo "$CMD" | grep -qE 'rm -rf (/|~|\\$HOME)|git push (-f|--force)|DROP TABLE'; then
  echo "Bloqueado por política: '$CMD'. Proponé una alternativa segura." >&2
  exit 2   # bloquea; stderr vuelve a Claude
fi
exit 0     # sin objeción: sigue el flujo de permisos normal

# chmod +x .claude/hooks/block-dangerous.sh`);
  };
  r.addEventListener('change', run); run();
 }});

const cardHTML = t => `<div class="tcard" data-open="${t.id}"><button class="fav ${state.favs.includes(t.id) ? 'on' : ''}" data-fav="${t.id}" title="Favorito">★</button><div class="ico">${t.ico}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>${tagHTML(t)}</div>`;
function side() {
 const cur = location.hash.slice(1);
 $('#side').innerHTML = `<a href="#" class="${!cur ? 'on' : ''}">⌂ Inicio</a>` + (state.favs.length ? `<h4>Favoritos</h4>` + state.favs.map(id => TOOLS.find(t => t.id === id)).filter(Boolean).map(t => `<a href="#${t.id}" class="${cur === t.id ? 'on' : ''}">★ ${esc(t.name)}</a>`).join('') : '') +
  CATS.map(([c, n]) => `<h4>${n}</h4>` + TOOLS.filter(t => t.cat === c).map(t => `<a href="#${t.id}" class="${cur === t.id ? 'on' : ''}"><span style="width:18px;text-align:center;color:var(--acc)">${t.ico}</span>${esc(t.name)}</a>`).join('')).join('');
}
function home() {
 const q = state.q.toLowerCase(), list = TOOLS.filter(t => (!state.cert || t.certs.includes(state.cert)) && (!q || (t.name + ' ' + t.desc + ' ' + t.certs.map(c => CERTS[c].code).join(' ')).toLowerCase().includes(q)));
 const favs = state.favs.map(id => TOOLS.find(t => t.id === id)).filter(t => t && list.includes(t));
 $('#main').innerHTML = `<div class="hero"><h1>Herramientas para profesionales de Claude</h1><p>${TOOLS.length} utilidades que corren en tu navegador para diseñar prompts, estimar costos, configurar Claude Code, MCP y agentes — organizadas según lo que evalúan las certificaciones Associate, Developer y Architect y el Partner Badge de Claude Code. Nada se envía a ningún servidor.</p></div>
  <div class="chips"><button class="chip ${!state.cert ? 'on' : ''}" data-cert="">Todas</button>${Object.entries(CERTS).map(([k, c]) => `<button class="chip ${state.cert === k ? 'on' : ''}" data-cert="${k}">${c.code} · ${c.name}</button>`).join('')}</div>
  ${favs.length ? `<div class="sec-title">★ Favoritos</div><div class="cards">${favs.map(cardHTML).join('')}</div>` : ''}
  ${CATS.map(([c, n]) => { const ts = list.filter(t => t.cat === c); return ts.length ? `<div class="sec-title">${n}</div><div class="cards">${ts.map(cardHTML).join('')}</div>` : ''; }).join('') || '<div class="empty">Ninguna herramienta coincide con la búsqueda.</div>'}
  <footer>Proyecto independiente, no afiliado ni respaldado por Anthropic. “Claude” y “Claude Code” son marcas de Anthropic. Precios y datos de exámenes de fuentes públicas a noviembre 2026: verificalos en la documentación oficial.</footer>`;
}
function toolView(t) {
 $('#main').innerHTML = `<div class="tool-head"><div class="ico" style="width:44px;height:44px;font-size:21px">${t.ico}</div><div style="flex:1"><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p>${tagHTML(t)}</div><button class="hbtn fav ${state.favs.includes(t.id) ? 'on' : ''}" style="position:static;font-size:15px" data-fav="${t.id}">★</button></div><div id="tool-root">${t.html()}</div>`;
 t.init($('#tool-root'));
}
function render() {
 const id = location.hash.slice(1), t = TOOLS.find(x => x.id === id);
 side(); t ? toolView(t) : home(); $('#side').classList.remove('open');
 window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
 const f = e.target.closest('[data-fav]'); if (f) { e.stopPropagation(); const id = f.dataset.fav; state.favs = state.favs.includes(id) ? state.favs.filter(x => x !== id) : [...state.favs, id]; store.set('ct-favs', state.favs); f.classList.toggle('on'); side(); if (!location.hash.slice(1)) home(); return; }
 const c = e.target.closest('[data-cert]'); if (c) { state.cert = c.dataset.cert; home(); return; }
 const o = e.target.closest('[data-open]'); if (o) { location.hash = o.dataset.open; return; }
});
$('#homeLink').onclick = () => { if (location.hash) location.hash = ''; else render(); };
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
$('#q').addEventListener('input', e => { state.q = e.target.value; if (location.hash.slice(1)) { history.replaceState(null, '', location.pathname + location.search); side(); } home(); });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
const theme = store.get('ct-theme', 'dark'); document.documentElement.dataset.theme = theme;
$('#themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('ct-theme', t); };
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
